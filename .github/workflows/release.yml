name: Signed Windows release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-')
    runs-on: windows-latest
    environment: release-signing
    permissions:
      contents: read
      id-token: write
    env:
      ARTIFACT_SIGNING_ENDPOINT: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
      ARTIFACT_SIGNING_ACCOUNT: ${{ vars.ARTIFACT_SIGNING_ACCOUNT }}
      ARTIFACT_SIGNING_PROFILE: ${{ vars.ARTIFACT_SIGNING_PROFILE }}
      ARTIFACT_SIGNING_PUBLISHER: ${{ vars.ARTIFACT_SIGNING_PUBLISHER }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Validate release tag and configuration
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -cne "v$version" -or $version -notmatch '^\d+\.\d+\.\d+$') {
            throw "Release tag must match the stable package.json version."
          }
          foreach ($name in @("ARTIFACT_SIGNING_ENDPOINT", "ARTIFACT_SIGNING_ACCOUNT", "ARTIFACT_SIGNING_PROFILE", "ARTIFACT_SIGNING_PUBLISHER")) {
            if (-not [Environment]::GetEnvironmentVariable($name)) { throw "Missing release configuration: $name" }
          }
      - run: npm ci
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - run: npm run package:signed
      - run: npm run test:updates:smoke
      - run: npm run verify:release
      - name: Generate notices, SBOM, and checksums
        shell: pwsh
        run: |
          npm sbom --omit=dev --sbom-format=cyclonedx | Set-Content -Encoding utf8 release\SBOM.cdx.json
          if ($LASTEXITCODE -ne 0) { throw "SBOM generation failed." }
          Copy-Item prds\THIRD-PARTY-NOTICES.md release\THIRD-PARTY-NOTICES.md
          npm run checksums
          if ($LASTEXITCODE -ne 0) { throw "Checksum generation failed." }
      - uses: actions/upload-artifact@v4
        with:
          name: signed-windows-release
          if-no-files-found: error
          path: |
            release/CSU-Console-Setup-*.exe
            release/CSU-Console-Setup-*.exe.blockmap
            release/latest.yml
            release/SHA256SUMS.txt
            release/SBOM.cdx.json
            release/THIRD-PARTY-NOTICES.md

  draft:
    needs: build
    runs-on: windows-latest
    environment: release-publish
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: signed-windows-release
          path: release
      - name: Create draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $files = (Get-ChildItem release -File).FullName
          gh release create $env:GITHUB_REF_NAME @files --repo $env:GITHUB_REPOSITORY --verify-tag --draft --generate-notes --title "CSU Console $env:GITHUB_REF_NAME"
          if ($LASTEXITCODE -ne 0) { throw "Draft release creation failed." }
